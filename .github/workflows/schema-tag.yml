name: Schema Tag

on:
  push:
    branches: [main]

# Runs one at a time so each run sees the tag the previous one pushed.
concurrency:
  group: schema-tag
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  schema-tag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find merged PR labels
        id: pr
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No merged PR for ${{ github.sha }}; skipping"
            exit 0
          fi
          echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "labels=$(jq -r '[.labels[].name] | join(" ")' <<<"$pr")" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Tag next schema version
        if: steps.pr.outputs.number != ''
        run: |
          tag=$(.github/scripts/next-schema-tag.sh "${{ github.sha }}" "$LABELS")
          if [ -z "$tag" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag (#$PR_NUMBER)" "${{ github.sha }}"
          git push origin "$tag"
          echo "Tagged ${{ github.sha }} as $tag" >> "$GITHUB_STEP_SUMMARY"
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
