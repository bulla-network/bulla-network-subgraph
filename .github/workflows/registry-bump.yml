name: Registry Bump

# bulla-registry starts this after each @bulla/registry release (bulla-registry-notify), passing the new
# version. It bumps the package, runs the checks, commits the bump to main as releasebot-bulla, and
# deploys the networks whose manifest changed (Deploy); Promote Pending moves dev once each has synced.
# A new major fails: a breaking registry release needs a deliberate bump.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "@bulla/registry version to bump to"
        required: true
        type: string

concurrency:
  group: registry-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-22.04
    outputs:
      networks: ${{ steps.changed.outputs.networks }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Mint a releasebot-bulla token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASEBOT_APP_ID }}
          private-key: ${{ secrets.RELEASEBOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Check the version
        id: check
        working-directory: bulla-contracts
        run: |
          current=$(node -p 'require("./package.json").dependencies["@bulla/registry"]')
          if [ "$current" = "$VERSION" ]; then
            echo "Already on @bulla/registry $VERSION"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${current%%.*}" != "${VERSION%%.*}" ]; then
            echo "::error::@bulla/registry $VERSION is a new major (from $current). A breaking registry release needs a deliberate bump."
            exit 1
          fi

      - name: Bump
        if: steps.check.outputs.skip != 'true'
        working-directory: bulla-contracts
        run: |
          yarn --frozen-lockfile
          cp node_modules/@bulla/registry/registry.json "$RUNNER_TEMP/registry-before.json"
          yarn add "@bulla/registry@${VERSION}" --exact

      # releasebot bypasses the required checks, so these are the only gate before the push.
      - name: Test, and build every network
        if: steps.check.outputs.skip != 'true'
        working-directory: bulla-contracts
        run: |
          yarn test
          for network in $(ls config | sed 's/\.json$//'); do yarn build:${network}; done

      - name: Networks whose manifest changed
        id: changed
        if: steps.check.outputs.skip != 'true'
        working-directory: bulla-contracts
        run: |
          networks=$(node src/scripts/changed-networks.js "$RUNNER_TEMP/registry-before.json")
          echo "Networks to deploy: $networks"
          echo "networks=$networks" >> "$GITHUB_OUTPUT"

      - name: Commit and push the bump
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add bulla-contracts/package.json bulla-contracts/yarn.lock
          git commit -m "fix(deps): @bulla/registry ${VERSION}"
          # A Deploy or Promote run may have pushed records meanwhile; they don't touch package.json or yarn.lock.
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: bump
    if: needs.bump.outputs.networks != '' && needs.bump.outputs.networks != '[]'
    strategy:
      fail-fast: false
      matrix:
        network: ${{ fromJSON(needs.bump.outputs.networks) }}
    uses: ./.github/workflows/deploy.yml
    with:
      network: ${{ matrix.network }}
    secrets: inherit
