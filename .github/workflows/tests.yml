name: Tests
on:
  push:
    branches: [main, current-deployed-version, v2-main]
  pull_request:
    branches: [main, current-deployed-version, v2-main]
  workflow_dispatch:
jobs:
  Test-Mappings:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org/
      - name: install yarn and test
        run: |
          yarn
          yarn build
          yarn test
        working-directory: ./bulla-contracts

      # Tells bulla-registry to consolidate now. The token comes from the bulla-registry-notify app, which
      # can only start workflows in bulla-registry (Actions: write), so its key can't change any code.
      - name: Mint a bulla-registry-notify token
        id: registry-notify
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REGISTRY_NOTIFY_APP_ID }}
          private-key: ${{ secrets.REGISTRY_NOTIFY_APP_PRIVATE_KEY }}
          owner: bulla-network
          repositories: bulla-registry
          permission-actions: write

      - name: Notify bulla-registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.registry-notify.outputs.token }}
        run: gh workflow run consolidate.yml -R bulla-network/bulla-registry -f source=${{ github.repository }}
